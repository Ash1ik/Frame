<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="primaryCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006B5F"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="accentIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="accentSky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#14B8A6"/>
    </marker>
    <marker id="arrowSky" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#FBBF24"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#818CF8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="958" height="618" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="url(#accentTeal)"/>
    <text x="18" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">F</text>
    <text x="48" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Frame Architecture &amp; Data Flow</text>
    <text x="48" y="40" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">Modern Android Architecture (MVVM + Unidirectional Data Flow + Clean Separation)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(680, 36)">
    <line x1="0" y1="10" x2="24" y2="10" stroke="#14B8A6" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
    <text x="32" y="14" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">User Actions / Events</text>
    <line x1="0" y1="28" x2="24" y2="28" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrowSky)"/>
    <text x="32" y="32" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">State &amp; Flow Emits</text>
  </g>

  <!-- ================= 1. UI LAYER (PRESENTATION) ================= -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect x="0" y="0" width="880" height="110" rx="12" fill="url(#primaryCard)" stroke="#475569" stroke-width="1"/>
    <!-- Layer Label -->
    <rect x="16" y="-12" width="180" height="24" rx="6" fill="url(#accentTeal)"/>
    <text x="106" y="4" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.5">PRESENTATION LAYER (UI)</text>

    <!-- Sub-boxes -->
    <g transform="translate(20, 24)">
      <!-- NavHost -->
      <rect x="0" y="0" width="150" height="66" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="75" y="28" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">FrameNavHost</text>
      <text x="75" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Navigation Compose</text>

      <!-- LoginScreen -->
      <rect x="170" y="0" width="160" height="66" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="250" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">LoginScreen</text>
      <text x="250" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Jetpack Compose M3</text>

      <!-- SignUpScreen -->
      <rect x="350" y="0" width="160" height="66" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="430" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">SignUpScreen</text>
      <text x="430" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Jetpack Compose M3</text>

      <!-- HomeScreen -->
      <rect x="530" y="0" width="150" height="66" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="605" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">HomeScreen</text>
      <text x="605" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">User Dashboard</text>

      <!-- Components & Theme -->
      <rect x="700" y="0" width="140" height="66" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="770" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">UI Components</text>
      <text x="770" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Theme &amp; Custom Fields</text>
    </g>
  </g>

  <!-- Connectors between UI and ViewModels -->
  <!-- Down Action -->
  <path d="M 470 205 L 470 238" stroke="#14B8A6" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <text x="460" y="226" fill="#14B8A6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="end">User Events</text>
  <!-- Up State -->
  <path d="M 510 238 L 510 205" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowSky)"/>
  <text x="520" y="226" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="start">UI State Observables</text>

  <!-- ================= 2. VIEWMODEL LAYER ================= -->
  <g transform="translate(40, 240)" filter="url(#shadow)">
    <rect x="0" y="0" width="880" height="100" rx="12" fill="url(#primaryCard)" stroke="#475569" stroke-width="1"/>
    <!-- Layer Label -->
    <rect x="16" y="-12" width="160" height="24" rx="6" fill="url(#accentIndigo)"/>
    <text x="96" y="4" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.5">VIEWMODEL LAYER</text>

    <g transform="translate(20, 20)">
      <!-- LoginViewModel -->
      <rect x="70" y="0" width="220" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="180" y="26" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">LoginViewModel</text>
      <text x="180" y="45" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Manages LoginUiState</text>

      <!-- SignupViewModel -->
      <rect x="330" y="0" width="220" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="440" y="26" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">SignupViewModel</text>
      <text x="440" y="45" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Manages SignupUiState</text>

      <!-- HomeViewModel -->
      <rect x="590" y="0" width="220" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="700" y="26" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">HomeViewModel</text>
      <text x="700" y="45" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Profile &amp; Session Management</text>
    </g>
  </g>

  <!-- Connectors between ViewModels and Repository -->
  <path d="M 470 340 L 470 373" stroke="#14B8A6" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <text x="460" y="361" fill="#14B8A6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="end">Suspend Calls</text>

  <path d="M 510 373 L 510 340" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowSky)"/>
  <text x="520" y="361" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="start">Domain Results / DTOs</text>

  <!-- ================= 3. REPOSITORY LAYER ================= -->
  <g transform="translate(40, 375)" filter="url(#shadow)">
    <rect x="0" y="0" width="880" height="85" rx="12" fill="url(#primaryCard)" stroke="#475569" stroke-width="1"/>
    <!-- Layer Label -->
    <rect x="16" y="-12" width="160" height="24" rx="6" fill="url(#accentAmber)"/>
    <text x="96" y="4" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.5">REPOSITORY LAYER</text>

    <!-- Repository Box -->
    <g transform="translate(180, 16)">
      <rect x="0" y="0" width="520" height="54" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
      <text x="260" y="24" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">AuthRepository (Single Source of Truth)</text>
      <text x="260" y="42" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Coordinates login(), signup(), getProfile(), token storage &amp; session validation</text>
    </g>
  </g>

  <!-- Connectors between Repository and Data Sources -->
  <path d="M 310 460 L 310 488" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M 650 460 L 650 488" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- ================= 4. DATA SOURCES LAYER ================= -->
  <g transform="translate(40, 490)" filter="url(#shadow)">
    <rect x="0" y="0" width="880" height="105" rx="12" fill="url(#primaryCard)" stroke="#475569" stroke-width="1"/>
    <!-- Layer Label -->
    <rect x="16" y="-12" width="150" height="24" rx="6" fill="url(#accentSky)"/>
    <text x="91" y="4" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.5">DATA SOURCES LAYER</text>

    <!-- Local Source -->
    <g transform="translate(30, 20)">
      <rect x="0" y="0" width="370" height="66" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="185" y="26" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Local Storage: TokenStore</text>
      <text x="185" y="44" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">In-Memory Bearer Token Cache</text>
      <text x="185" y="58" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">saveToken() | clear() | accessToken</text>
    </g>

    <!-- Remote Source -->
    <g transform="translate(480, 20)">
      <rect x="0" y="0" width="370" height="66" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="185" y="26" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Remote: Retrofit + OkHttp (AuthApi)</text>
      <text x="185" y="44" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">REST API Client (Gson Converter)</text>
      <text x="185" y="58" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">POST /auth/login | POST /auth/signup | GET /users/me</text>
    </g>
  </g>
</svg>
